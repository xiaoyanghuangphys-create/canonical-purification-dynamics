name: Factor vs witness scaling audit
on:
  push:
    branches:
      - research/factor-vs-witness-scaling
    paths:
      - factor_tdvp_accelerated/size_scaling.py
      - .github/workflows/factor-vs-witness-scaling.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-scaling-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      VECLIB_MAXIMUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/factor-vs-witness-scaling
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install numerical requirements
        run: python -m pip install -r requirements.txt
      - name: Run audited full size sweep (each case isolated and time-limited)
        run: |
          python -m factor_tdvp_accelerated.size_scaling \
            --suite full --out factor_tdvp_accelerated/size_scaling_results \
            --timeout 90
      - name: Upload raw per-case logs for failure auditing
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: factor-vs-witness-raw
          path: factor_tdvp_accelerated/size_scaling_results/
          retention-days: 14
          if-no-files-found: warn
      - name: Commit measured summary to source branch
        if: always()
        run: |
          if [ -f factor_tdvp_accelerated/size_scaling_results/measurements.csv ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -f factor_tdvp_accelerated/size_scaling_results/measurements.csv
            git add -f factor_tdvp_accelerated/size_scaling_results/measurements.json
            git add -f factor_tdvp_accelerated/size_scaling_results/report.md
            git add -f factor_tdvp_accelerated/size_scaling_results/environment.json
            git add -f factor_tdvp_accelerated/size_scaling_results/frontier_*.csv || true
            if ! git diff --cached --quiet; then
              git commit -m "Record isolated factor versus witness scaling measurements"
              git push origin HEAD:research/factor-vs-witness-scaling
            fi
          fi
